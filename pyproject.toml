[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pktforge"
dynamic = ["version"]
description = "Build Cisco Packet Tracer 9 labs (.pkt) from a text spec, and lint them for 'looks right, passes no traffic' mistakes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["packet-tracer", "cisco", "pkt", "networking", "lab", "cli", "agents"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
pktforge = "pktforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pktforge.__version__" }

[tool.setuptools.packages.find]
include = ["pktforge*"]

[tool.setuptools.package-data]
pktforge = ["data/*", "data/examples/*", "_vendor/*.py", "_vendor/pkt_core/*.py", "_vendor/pkt_core/*/*.py"]
